name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}

    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import os
          import subprocess

          def git_lines(*args: str) -> list[str]:
              return subprocess.check_output(["git", *args], text=True).splitlines()

          def changed_files() -> list[str]:
              event_name = os.environ["GITHUB_EVENT_NAME"]
              if event_name == "pull_request":
                  base = os.environ["PR_BASE_SHA"]
                  head = os.environ["PR_HEAD_SHA"]
                  subprocess.run(["git", "fetch", "--no-tags", "origin", base, head], check=False)
                  return git_lines("diff", "--name-only", f"{base}...{head}")

              before = os.environ.get("BEFORE_SHA", "")
              current = os.environ["CURRENT_SHA"]
              if before and set(before) != {"0"}:
                  return git_lines("diff", "--name-only", f"{before}..{current}")
              return git_lines("diff-tree", "--no-commit-id", "--name-only", "-r", current)

          def is_markdown(path: str) -> bool:
              return PurePosixPath(path).suffix.lower() == ".md"

          def selects_backend(path: str) -> bool:
              return (
                  (path.startswith("backend/") and not is_markdown(path))
                  or (path.startswith("e2e/") and not is_markdown(path))
                  or path in {"docker-compose.yml", "start-local-prototype.sh", "up-and-test.sh"}
                  or path.startswith(".github/workflows/")
              )

          def selects_frontend(path: str) -> bool:
              return (
                  (path.startswith("frontend/") and not is_markdown(path))
                  or (path.startswith("e2e/") and not is_markdown(path))
                  or path in {"docker-compose.yml", "start-local-prototype.sh", "up-and-test.sh"}
                  or path.startswith(".github/workflows/")
              )

          files = changed_files()
          backend = any(selects_backend(path) for path in files)
          frontend = any(selects_frontend(path) for path in files)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"backend={'true' if backend else 'false'}\n")
              output.write(f"frontend={'true' if frontend else 'false'}\n")
          PY

      - name: Summarize selected checks
        run: |
          echo "Backend checks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend checks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend tests and compile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/image-translator-pycache
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

      - name: Compile backend
        env:
          PYTHONPYCACHEPREFIX: /tmp/image-translator-pycache
        run: python -m compileall app migrations

  frontend:
    name: Frontend typecheck, lint, tests, build, and Playwright
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        if: >
          github.ref == 'refs/heads/main' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'main' &&
            contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
          )
        run: npx playwright install --with-deps chromium

      - name: Run frontend Playwright smoke tests
        if: >
          github.ref == 'refs/heads/main' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'main' &&
            contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
          )
        env:
          VITE_API_MODE: mock
        run: npm run test:e2e

  no-app-checks:
    name: No app checks required
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend != 'true'

    steps:
      - name: Explain skipped app checks
        run: |
          echo "No backend or frontend app checks are required for this change set." >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation, governance, templates, and AI-instruction-only changes use this lightweight success job." >> "$GITHUB_STEP_SUMMARY"
