name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}

    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/*.md'
              - '!backend/**/*.md'
              - 'e2e/**'
              - '!e2e/*.md'
              - '!e2e/**/*.md'
              - 'docker-compose.yml'
              - 'start-local-prototype.sh'
              - 'up-and-test.sh'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '!frontend/*.md'
              - '!frontend/**/*.md'
              - 'e2e/**'
              - '!e2e/*.md'
              - '!e2e/**/*.md'
              - 'docker-compose.yml'
              - 'start-local-prototype.sh'
              - 'up-and-test.sh'
              - '.github/workflows/**'

      - name: Summarize selected checks
        run: |
          echo "Backend checks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend checks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend tests and compile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/image-translator-pycache
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

      - name: Compile backend
        env:
          PYTHONPYCACHEPREFIX: /tmp/image-translator-pycache
        run: python -m compileall app migrations

  frontend:
    name: Frontend typecheck, lint, tests, build, and Playwright
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend Playwright smoke tests
        env:
          VITE_API_MODE: mock
        run: npm run test:e2e

  no-app-checks:
    name: No app checks required
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend != 'true'

    steps:
      - name: Explain skipped app checks
        run: |
          echo "No backend or frontend app checks are required for this change set." >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation, governance, templates, and AI-instruction-only changes use this lightweight success job." >> "$GITHUB_STEP_SUMMARY"
