name: CodeQL

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  changes:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    outputs:
      javascript_typescript: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.javascript_typescript == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.python == 'true' }}

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import os
          import subprocess

          def git_lines(*args: str) -> list[str]:
              return subprocess.check_output(["git", *args], text=True).splitlines()

          def changed_files() -> list[str]:
              event_name = os.environ["GITHUB_EVENT_NAME"]
              if event_name == "pull_request":
                  base = os.environ["PR_BASE_SHA"]
                  head = os.environ["PR_HEAD_SHA"]
                  subprocess.run(["git", "fetch", "--no-tags", "origin", base, head], check=False)
                  return git_lines("diff", "--name-only", f"{base}...{head}")

              before = os.environ.get("BEFORE_SHA", "")
              current = os.environ["CURRENT_SHA"]
              if before and set(before) != {"0"}:
                  return git_lines("diff", "--name-only", f"{before}..{current}")
              return git_lines("diff-tree", "--no-commit-id", "--name-only", "-r", current)

          def is_markdown(path: str) -> bool:
              return PurePosixPath(path).suffix.lower() == ".md"

          def selects_javascript_typescript(path: str) -> bool:
              return (
                  (path.startswith("frontend/") and not is_markdown(path))
                  or (path.startswith("e2e/") and not is_markdown(path))
                  or path.startswith(".github/workflows/")
              )

          def selects_python(path: str) -> bool:
              return (
                  (path.startswith("backend/") and not is_markdown(path))
                  or path.startswith(".github/workflows/")
              )

          files = changed_files()
          javascript_typescript = any(selects_javascript_typescript(path) for path in files)
          python = any(selects_python(path) for path in files)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"javascript_typescript={'true' if javascript_typescript else 'false'}\n"
              )
              output.write(f"python={'true' if python else 'false'}\n")
          PY

      - name: Summarize selected languages
        run: |
          echo "JavaScript/TypeScript analysis: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.javascript_typescript == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Python analysis: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.python == 'true' }}" >> "$GITHUB_STEP_SUMMARY"

  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.javascript_typescript == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  analyze-python:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  no-codeql-analysis:
    name: No CodeQL analysis required
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.javascript_typescript != 'true' && needs.changes.outputs.python != 'true'

    steps:
      - name: Explain skipped CodeQL analysis
        run: |
          echo "No CodeQL language analysis is required for this change set." >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled and manual CodeQL runs still analyze both configured languages." >> "$GITHUB_STEP_SUMMARY"
