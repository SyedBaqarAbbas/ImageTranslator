services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/image_translator
      CELERY_TASK_ALWAYS_EAGER: "true"
      LOCAL_STORAGE_PATH: /app/data/storage
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-opus_mt}
      OPUS_MT_MODEL_ROOT: ${OPUS_MT_MODEL_ROOT:-/app/models/opus-mt}
      RENDER_ENGINE: ${RENDER_ENGINE:-pillow}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data/storage:/app/data/storage
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: image_translator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
